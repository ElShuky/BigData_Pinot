services:
  zookeeper:
    image: zookeeper:3.9.2
    container_name: pinot-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      JVMFLAGS: "-Xms128m -Xmx256m"
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.8.0
    container_name: pinot-kafka
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./workspace:/workspace
    mem_limit: 1024m

  pinot-controller:
    image: apachepinot/pinot:1.2.0
    command: "StartController -zkAddress zookeeper:2181"
    container_name: pinot-controller
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-Dlog4j2.configurationFile=conf/log4j2.xml -Dpinot.admin.system.exit=true -Xms256m -Xmx512m -XX:+UseG1GC"
    volumes:
      - ./workspace:/workspace
    mem_limit: 1024m
    depends_on:
      - zookeeper

  pinot-broker:
    image: apachepinot/pinot:1.2.0
    command: "StartBroker -zkAddress zookeeper:2181"
    container_name: pinot-broker
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-Dlog4j2.configurationFile=conf/log4j2.xml -Dpinot.admin.system.exit=true -Xms256m -Xmx512m -XX:+UseG1GC"
    mem_limit: 1024m
    depends_on:
      - pinot-controller

  pinot-server:
    image: apachepinot/pinot:1.2.0
    command: "StartServer -zkAddress zookeeper:2181"
    container_name: pinot-server
    ports:
      - "8098:8098"
    environment:
      JAVA_OPTS: "-Dlog4j2.configurationFile=conf/log4j2.xml -Dpinot.admin.system.exit=true -Xms512m -Xmx1g -XX:+UseG1GC"
    volumes:
      - ./workspace:/workspace
    mem_limit: 2048m
    depends_on:
      - pinot-broker
